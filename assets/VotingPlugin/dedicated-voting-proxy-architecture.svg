<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">VotingPlugin Dedicated Voting Proxy Architecture</title>
<desc id="desc">Votes enter one dedicated VotingPlugin proxy. Regional player-facing proxies do not run VotingPlugin. The dedicated proxy and backend servers exchange votes and player presence through one selected non-plugin-messaging transport, and they share one SQL database.</desc>
<defs>
  <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#6d28d9"/></marker>
  <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#d95f02"/></marker>
  <marker id="orangeArrowStart" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto"><path d="M9,0 L9,6 L0,3z" fill="#d95f02"/></marker>
  <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#2563eb"/></marker>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#111827}.title{font-size:46px;font-weight:700}.h{font-size:27px;font-weight:700}.m{font-size:20px;font-weight:700}.s{font-size:16px}.tiny{font-size:14px}.vote{stroke:#6d28d9;stroke-width:4;fill:none;marker-end:url(#purpleArrow)}.transport{stroke:#d95f02;stroke-width:4;fill:none;marker-start:url(#orangeArrowStart);marker-end:url(#orangeArrow)}.player{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#blueArrow)}.storage{stroke:#d95f02;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#orangeArrow)}</style>
</defs>
<rect width="1600" height="900" fill="#f8fafc"/>
<text x="800" y="58" text-anchor="middle" class="title">Dedicated Voting Proxy Architecture</text>

<g class="box"><rect x="470" y="90" width="660" height="78" rx="16" fill="#ecfdf3" stroke="#15803d" stroke-width="2"/></g>
<text x="800" y="125" text-anchor="middle" class="h" fill="#166534">Voting Websites</text><text x="800" y="150" text-anchor="middle" class="s">Send votes to the dedicated proxy's Votifier listener</text>
<path d="M800 168V198" class="vote"/>

<g class="box"><rect x="415" y="205" width="770" height="115" rx="18" fill="#f3e8ff" stroke="#7e22ce" stroke-width="3"/></g>
<text x="800" y="246" text-anchor="middle" class="h" fill="#6b21a8">Dedicated Voting Proxy</text>
<text x="800" y="277" text-anchor="middle" class="m" fill="#6b21a8">VotingPlugin + VotifierPlus/NuVotifier</text>
<text x="800" y="302" text-anchor="middle" class="s">DedicatedVotingProxy: true • no local players required</text>

<g class="box"><rect x="85" y="365" width="340" height="155" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/></g>
<text x="255" y="405" text-anchor="middle" class="h" fill="#1d4ed8">Regional Proxies</text>
<text x="255" y="438" text-anchor="middle" class="m" fill="#1d4ed8">Player-facing only</text>
<text x="255" y="468" text-anchor="middle" class="s">No VotingPlugin</text>
<text x="255" y="494" text-anchor="middle" class="tiny">Carry player connections, not vote routing</text>

<g class="box"><rect x="535" y="375" width="530" height="135" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/></g>
<text x="800" y="415" text-anchor="middle" class="h" fill="#c2410c">Choose One Communication Path</text>
<text x="800" y="453" text-anchor="middle" class="m" fill="#c2410c">MYSQL • REDIS • MQTT • SOCKETS</text>
<text x="800" y="486" text-anchor="middle" class="s">Votes go down • backend presence comes up</text>
<path d="M800 320V373" class="transport"/>

<g class="box"><rect x="1190" y="365" width="325" height="155" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/></g>
<text x="1352" y="405" text-anchor="middle" class="h" fill="#b91c1c">Not Supported</text>
<text x="1352" y="447" text-anchor="middle" class="m" fill="#b91c1c">PLUGINMESSAGING</text>
<text x="1352" y="478" text-anchor="middle" class="s">Needs a player-facing proxy</text>
<text x="1352" y="503" text-anchor="middle" class="tiny">Dedicated presence routing is disabled</text>

<path d="M255 520V625H470" class="player"/>
<text x="285" y="592" class="s" fill="#1d4ed8">Player connections</text>
<path d="M800 510V595" class="transport"/>

<g class="box" fill="#eff6ff" stroke="#2563eb" stroke-width="2"><rect x="340" y="625" width="290" height="105" rx="16"/><rect x="655" y="625" width="290" height="105" rx="16"/><rect x="970" y="625" width="290" height="105" rx="16"/></g>
<g text-anchor="middle"><text x="485" y="668" class="m" fill="#1d4ed8">Backend 1</text><text x="485" y="700" class="s">VotingPlugin • Server: lobby</text><text x="800" y="668" class="m" fill="#1d4ed8">Backend 2</text><text x="800" y="700" class="s">VotingPlugin • Server: survival</text><text x="1115" y="668" class="m" fill="#1d4ed8">Backend 3</text><text x="1115" y="700" class="s">VotingPlugin • Server: games</text></g>
<line x1="470" y1="595" x2="1130" y2="595" stroke="#d95f02" stroke-width="4"/>
<path d="M485 595V623M800 595V623M1115 595V623" class="transport"/>

<g class="box"><ellipse cx="1400" cy="675" rx="110" ry="28" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><path d="M1290 675v125c0 17 49 29 110 29s110-12 110-29V675" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><ellipse cx="1400" cy="800" rx="110" ry="29" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/></g>
<text x="1400" y="727" text-anchor="middle" class="h" fill="#c2410c"><tspan x="1400">Shared SQL</tspan><tspan x="1400" dy="34">Database</tspan></text>
<path d="M1185 262H1550V675H1515M1260 700H1285" class="storage"/>

<g class="box"><rect x="85" y="785" width="1175" height="72" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/></g>
<text x="672" y="815" text-anchor="middle" class="m" fill="#166534">Routing remains controlled by SendVotesToAllServers</text>
<text x="672" y="842" text-anchor="middle" class="s">false: confirmed current backend • true: every eligible backend • unknown/offline: existing cache path</text>
</svg>
